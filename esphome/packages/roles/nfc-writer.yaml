# Bench NFC writer / R/W — PN532 SPI.
# Tags receive typed Communifarm NDEF identity JSON (stable refs only).
# Pending payload is pushed from HA via text sensor / homeassistant text entity.
spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
  miso_pin: ${spi_miso_pin}
  id: cf_nfc_spi

pn532_spi:
  id: cf_pn532_writer
  cs_pin: ${nfc_cs_pin}
  update_interval: 1s
  on_tag:
    then:
      - text_sensor.template.publish:
          id: cf_last_nfc_uid_writer
          state: !lambda "return x;"

text_sensor:
  - platform: template
    name: "Last NFC UID"
    id: cf_last_nfc_uid_writer
    icon: mdi:nfc
  - platform: template
    name: "Pending NDEF"
    id: cf_pending_ndef_writer
    icon: mdi:nfc-variant

button:
  - platform: template
    name: "Prepare NDEF Write"
    icon: mdi:nfc-tap
    on_press:
      then:
        - logger.log:
            format: "Communifarm NDEF write armed. Pending=%s UID=%s"
            args:
              - id(cf_pending_ndef_writer).state.c_str()
              - id(cf_last_nfc_uid_writer).state.c_str()
        - logger.log: "Apply PN532 NDEF write lambda from ESPHome docs with cf_pending_ndef_writer payload."
