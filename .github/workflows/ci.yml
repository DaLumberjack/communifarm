name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check custom_components tests
      - name: Pytest T0
        run: pytest --cov=custom_components/communifarm --cov-report=term-missing

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        yaml_file:
          - esphome/examples/compile/cf-tent1-sensor01.yaml
          - esphome/examples/compile/cf-mixroom-scale01.yaml
          - esphome/examples/compile/cf-mixroom-nfc-scan01.yaml
          - esphome/examples/compile/cf-lab-nfc-write01.yaml
          - esphome/examples/compile/cf-lab-aio868.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v6
        with:
          yaml-file: ${{ matrix.yaml_file }}

  # Playwright / HA container stay local (cost). CI only checks the committed summary.
  e2e-local-report:
    runs-on: ubuntu-latest
    steps:
      # Depth 2 so summary-only tip commits can resolve parent == summary.git_sha.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve expected commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate committed local E2E summary
        run: |
          python scripts/e2e_local_report.py validate \
            --summary test-results/e2e/summary.json \
            --expected-sha "${{ steps.sha.outputs.value }}"
