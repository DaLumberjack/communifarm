name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check custom_components tests
      - name: Pytest T0
        run: pytest --cov=custom_components/communifarm --cov-report=term-missing

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        yaml_file:
          - esphome/examples/compile/cf-tent1-sensor01.yaml
          - esphome/examples/compile/cf-mixroom-scale01.yaml
          - esphome/examples/compile/cf-mixroom-nfc-scan01.yaml
          - esphome/examples/compile/cf-lab-nfc-write01.yaml
          - esphome/examples/compile/cf-lab-aio868.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v6
        with:
          yaml-file: ${{ matrix.yaml_file }}
