# KinCony KC868-AIO machine controller mockup.
# Relays are template switches until manufacturer pin maps are verified and substituted.
# Do not flash GPIO relays from guessed mappings.
substitutions:
  device_name: cf-lab-aio868
  friendly_name: Lab AIO868 Controller
  area_name: Grow Lab
  node_role: motor-controller
  firmware_version: "0.1.0-mock"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_ssid: "CF-AIO868-Fallback"
  fallback_password: !secret fallback_password

packages:
  base: !include ../packages/common/base.yaml
  wifi: !include ../packages/common/network-wifi.yaml
  diagnostics: !include ../packages/common/diagnostics.yaml
  failsafe: !include ../packages/common/failsafe.yaml
  board_meta: !include ../packages/boards/kincony-kc868-aio.yaml
  # Compile/flash board class until KinCony-specific board id is verified:
  board: !include ../packages/boards/esp32-d1-mini32.yaml
  role: !include ../packages/roles/motor-controller.yaml
