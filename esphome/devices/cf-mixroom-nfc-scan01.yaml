# Handheld / mobile PN532 scan-only reader on ESP32 D1 Mini32.
# Wiring: docs/hardware/nfc-readers-d1-mini32.md
substitutions:
  device_name: cf-mixroom-nfc-scan01
  friendly_name: Mixroom NFC Scanner 01
  area_name: Mix Room
  node_role: nfc-scanner
  firmware_version: "0.1.0-mock"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_ssid: "CF-NFC-Scan-Fallback"
  fallback_password: !secret fallback_password
  i2c_sda_pin: GPIO21
  i2c_scl_pin: GPIO22

packages:
  base: !include ../packages/common/base.yaml
  wifi: !include ../packages/common/network-wifi.yaml
  diagnostics: !include ../packages/common/diagnostics.yaml
  provisioning: !include ../packages/common/provisioning.yaml
  board: !include ../packages/boards/esp32-d1-mini32.yaml
  role: !include ../packages/roles/nfc-scanner.yaml
