# Tent environment sensor — ESP32-S3-WROOM-1 + BME688 + SHT3x + OneWire.
# Pins are substitutions for your soldered harness (not published as verified maps).
# Calibration package is shared — same numbers/buttons work on any node that includes it.
substitutions:
  device_name: cf-tent1-sensor01
  friendly_name: Tent 1 Sensor 01
  area_name: Tent 1
  node_role: sensor-monitor
  firmware_version: "0.2.0-mock"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_ssid: "CF-Tent1-Sensor-Fallback"
  fallback_password: !secret fallback_password
  # Fill from the soldered ESP32-S3-WROOM-1 harness before flash:
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9
  one_wire_pin: GPIO4
  one_wire_index: "0"
  bme688_address: "0x76"
  sht3x_address: "0x44"
  env_update_interval: 30s

packages:
  base: !include ../packages/common/base.yaml
  wifi: !include ../packages/common/network-wifi.yaml
  diagnostics: !include ../packages/common/diagnostics.yaml
  provisioning: !include ../packages/common/provisioning.yaml
  calibration: !include ../packages/common/sensor-calibration.yaml
  board: !include ../packages/boards/esp32-s3-wroom-1.yaml
  role: !include ../packages/roles/sensor-monitor.yaml
  # Optional private-only BSEC2 IAQ (not for CI / redistributed binaries):
  # bsec2: !include ../packages/roles/sensor-bme68x-bsec2.yaml
