transition_batch:
  name: Transition batch
  description: Move the starter production batch to the next lifecycle stage.
  fields:
    stage:
      name: Stage
      description: Target stage (active or complete).
      required: true
      selector:
        select:
          options:
            - active
            - complete

record_weight:
  name: Record weight
  description: Persist a mix weigh-in for the active production batch.

record_batch_milestone:
  name: Record batch milestone
  description: Append a mix/production milestone for the active batch.

complete_and_new_batch:
  name: Complete and new batch
  description: Complete the active batch and start a new one.

create_media_batch:
  name: Create media batch
  description: Start an agar or liquid-culture media prep batch (before introducing culture).
  fields:
    recipe_key:
      name: Recipe
      description: Media recipe key (mea_agar_500, honey_lc_500, karo_lc_500).
      example: mea_agar_500
      selector:
        select:
          options:
            - mea_agar_500
            - honey_lc_500
            - karo_lc_500
    name:
      name: Name
      description: Optional label for this media prep.
    recipe_scale:
      name: Recipe scale
      description: Scale factor 0.1–10 (default 1.0).
    vessel_count:
      name: Vessel count
      description: Number of plates or jars.
    zone_id:
      name: Zone ID
      description: Optional placement zone (e.g. still-air cabinet shelf).

record_media_weight:
  name: Record media weight
  description: Record one media recipe ingredient amount for a media batch.
  fields:
    media_batch_id:
      name: Media batch ID
      required: true
    amount:
      name: Amount
      required: true
    unit:
      name: Unit
      required: true
      selector:
        select:
          options:
            - g
            - ml
    ingredient:
      name: Ingredient
      required: true

record_media_milestone:
  name: Record media milestone
  description: Advance media prep (portion → sterilize → media_ready). LC also supports lc_stir_started / lc_stir_stopped.
  fields:
    media_batch_id:
      name: Media batch ID
      required: true
    event_type:
      name: Milestone
      required: true
      selector:
        select:
          options:
            - weighing_started
            - media_dissolved
            - media_portioned
            - media_sterilized
            - media_ready
            - media_failed
            - lc_stir_started
            - lc_stir_stopped

acquire_culture:
  name: Acquire culture
  description: >
    Register one culture vessel (jar/vial/plate). Name defaults to the mushroom
    variety. Pass variety_id or variety_name (creates custom variety if new).
  fields:
    name:
      name: Name
      description: Optional when variety_id / variety_name is set (defaults to variety).
    variety_id:
      name: Variety ID
    variety_name:
      name: Variety name
      description: Resolve existing or create custom variety.
    source_type:
      name: Source
      required: true
      selector:
        select:
          options:
            - wild
            - acquaintance
            - purchased
    form:
      name: Form
      required: true
      selector:
        select:
          options:
            - liquid_culture
            - grain_spawn
            - agar
            - spores
    container:
      name: Container
      selector:
        select:
          options:
            - syringe
            - sterile_bag
            - plate
            - jar
            - slant
            - vial
            - other
    strain_label:
      name: Strain label
    zone_id:
      name: Zone ID
      description: Optional placement zone (e.g. culture fridge shelf).
    nfc_uid:
      name: NFC tag UID
      description: Optional mock/handheld tag id (defaults to culture stable id).

create_variety:
  name: Create variety
  description: Add a custom mushroom variety to the catalog (seed list is built-in).
  fields:
    name:
      name: Variety name
      required: true
    notes:
      name: Notes

retire_variety:
  name: Retire variety
  description: Retire a custom variety (seed entries cannot be retired).
  fields:
    variety_id:
      name: Variety ID
      required: true

set_culture_status:
  name: Set culture vessel status
  description: >
    Update LC/grain vessel state (colonizing, ready, drawing, exhausted,
    contaminated, retired). Defaults to active inoculum when culture_id omitted.
  fields:
    status:
      name: Status
      required: true
      selector:
        select:
          options:
            - colonizing
            - ready
            - drawing
            - exhausted
            - contaminated
            - retired
            - active
            - consumed
    culture_id:
      name: Culture ID
      description: Optional; uses active inoculum when omitted.

introduce_culture:
  name: Introduce culture
  description: Introduce a culture into ready media; always creates a new child culture lot.
  fields:
    culture_id:
      name: Parent culture ID
      required: true
    media_batch_id:
      name: Media batch ID
      required: true
    child_name:
      name: Child culture name
    zone_id:
      name: Zone ID
      description: Optional storage zone for the child culture after intro.

inoculate_batch:
  name: Inoculate batch
  description: Link an active culture lot into the substrate production batch (N identical containers).
  fields:
    culture_id:
      name: Culture lot ID
      required: true
    container_type:
      name: Container type
      required: true
      selector:
        select:
          options:
            - block
            - tub
            - bag
            - jar
            - other
    container_count:
      name: Container count
      required: true
    substrate_g_per_container:
      name: Substrate g per container
      required: true
    inoculum_amount:
      name: Inoculum amount
    inoculum_unit:
      name: Inoculum unit
      selector:
        select:
          options:
            - ml
            - g
            - cc
            - wedge
            - other
    max_flushes:
      name: Max flushes
      description: Default 3.
    expected_check_at:
      name: Expected check at
      description: ISO timestamp for next operator check.
    notes:
      name: Notes
    zone_id:
      name: Zone ID
      description: Optional placement zone (level/shelf slot).

advance_production_stage:
  name: Advance production stage
  description: Move inoculated → incubating → fruiting → harvesting.
  fields:
    target_stage:
      name: Target stage
      selector:
        select:
          options:
            - incubating
            - fruiting
            - harvesting
    zone_id:
      name: Zone ID
      description: Optional — set batch location when advancing (e.g. fruiting tent level).

record_harvest:
  name: Record harvest
  description: Record flush harvest mass (g). Set is_final to complete the batch.
  fields:
    mass_g:
      name: Mass (g)
      required: true
    is_final:
      name: Final harvest
      selector:
        boolean:
    notes:
      name: Notes
    zone_id:
      name: Zone ID
      description: Optional harvest fridge shelf after pick.

add_batch_note:
  name: Add batch note
  description: Append a free-text batch_note milestone on the active batch.
  fields:
    note:
      name: Note
      required: true

set_check_reminder:
  name: Set check reminder
  description: Store expected_check_at and create a persistent notification.
  fields:
    expected_check_at:
      name: Expected check at
      required: true
      description: ISO timestamp.

ensure_placement_layout:
  name: Ensure placement layout
  description: Seed default tents/fridges/cabinets and slot zones for the site (idempotent).

ensure_climate_layout:
  name: Ensure climate layout
  description: >
    Seed the operator climate tree (outdoors, general room, tents, storage) and
    bind the sensors and machines labeled on the layout. The general room reuses
    the onboarding environment. Later calls keep existing nodes and bindings.

tick_climate:
  name: Tick climate control
  description: >
    Read bound sensors and command bound fans, AC, heater, humidifier,
    dehumidifier, lights, and the condensate pump. Does nothing for a node
    with control turned off.

bind_climate_role:
  name: Bind climate role
  description: >
    Attach a sensor or machine to a climate node. Use the entity registry id
    when you have one. Set waste_heat_to_parent on DC grow lights that warm
    the parent room.
  fields:
    node_id:
      name: Climate node ID
      required: true
    role:
      name: Role
      required: true
      description: >
        temperature, humidity, pressure, co2_ppm, circulation_fan, intake_fan,
        exhaust_fan, fresh_air_intake, ac, heater, humidifier, dehumidifier,
        light, float, or condensate_pump.
    entity_id:
      name: Entity ID
      required: true
    entity_entry_id:
      name: Entity registry ID
      description: Stable id. Defaults to entity_id.
    waste_heat_to_parent:
      name: Waste heat to parent
      description: DC driver heat lands in the parent room.
      default: false
      selector:
        boolean:

set_batch_location:
  name: Set batch location
  description: Place the active (or specified) production batch into a zone slot.
  fields:
    zone_id:
      name: Zone ID
      required: true
    batch_id:
      name: Batch ID
      description: Defaults to the active batch.

set_culture_location:
  name: Set culture location
  description: Place a culture lot into a zone slot (culture fridge shelf).
  fields:
    culture_id:
      name: Culture lot ID
      required: true
    zone_id:
      name: Zone ID
      required: true

set_media_location:
  name: Set media location
  description: Place a media prep batch into a zone slot (SAB or culture fridge).
  fields:
    media_batch_id:
      name: Media batch ID
      required: true
    zone_id:
      name: Zone ID
      required: true

resolve_nfc:
  name: Resolve NFC
  description: Look up the Communifarm object for a handheld-scanned NFC UID (SQLite is source of truth).
  fields:
    nfc_uid:
      name: NFC UID
      description: Defaults to input_text.esp32dev_last_nfc_uid from the handheld/scale reader.

check_in:
  name: Check in
  description: Resolve NFC, set harvest/move/inventory context, optionally update zone placement.
  fields:
    activity:
      name: Activity
      required: true
      selector:
        select:
          options:
            - harvest
            - move
            - inventory
            - check_in
    nfc_uid:
      name: NFC UID
    zone_id:
      name: Zone ID
      description: Optional — update object location on check-in (e.g. fruiting tent level).

bind_nfc:
  name: Bind NFC
  description: Assign a physical NFC UID to a container or batch (tag holds ID only).
  fields:
    object_type:
      name: Object type
      required: true
      selector:
        select:
          options:
            - container
            - batch
            - culture
            - media
    object_id:
      name: Object ID
      required: true
    nfc_uid:
      name: NFC UID
      description: Defaults to last handheld scan.

record_container_harvest:
  name: Record container harvest
  description: Confirm per-container flush mass after NFC harvest check-in. Returns container to fruiting unless final.
  fields:
    mass_g:
      name: Mass (g)
      required: true
    confirm:
      name: Confirm
      required: true
      selector:
        boolean:
    is_final:
      name: Final harvest for this container
      selector:
        boolean:
    return_to_fruiting:
      name: Return to fruiting
      description: Default true after a non-final flush.
      selector:
        boolean:
    container_id:
      name: Container ID
      description: Defaults to the active NFC harvest check-in.
    notes:
      name: Notes
    zone_id:
      name: Zone ID
      description: Optional — fruiting tent level when putting the block back.

record_sale:
  name: Record sale
  description: >
    Record a paid sale (general tracking). Pass sale_pack_id for a prepacked
    open pack, or harvest_id + mass_g to weigh at sale. Requires confirm=true.
  fields:
    venue_label:
      name: Venue
      required: true
    buyer_label:
      name: Buyer
      required: true
    payment_method:
      name: Payment method
      required: true
      selector:
        select:
          options:
            - cash
            - check
            - venmo
            - digital
            - other
    line_amount:
      name: Amount received
      required: true
    confirm:
      name: Confirm
      required: true
      selector:
        boolean:
    sale_pack_id:
      name: Sale pack ID
      description: Prepacked open pack to sell.
    harvest_id:
      name: Harvest ID
      description: Required for weigh-at-sale when not using the latest harvest.
    mass_g:
      name: Mass (g)
      description: Weigh-at-sale mass when sale_pack_id is omitted.
    product_label:
      name: Product label
    size_label:
      name: Size label
    notes:
      name: Notes
    currency:
      name: Currency
      description: Default USD.

record_sale_cleanup:
  name: Record sale cleanup
  description: After returning home — clean gear, put away, ready for next sale.
  fields:
    sale_id:
      name: Sale ID
      description: Defaults to the last recorded sale.
    sale_day:
      name: Sale day
      description: ISO date key; defaults to today.
    cleaned:
      name: Cleaned
      selector:
        boolean:
    put_away:
      name: Put away
      selector:
        boolean:
    ready_next:
      name: Ready for next
      selector:
        boolean:
    notes:
      name: Notes

upsert_air_vent:
  name: Upsert air vent
  description: >
    Create or update a labeled vent used for manual tachometer / air-exchange
    logging (intake, exhaust, circulation, or other).
  fields:
    label:
      name: Vent label
      required: true
      description: Stable human label, e.g. Fruiting intake left.
    vent_role:
      name: Vent role
      description: intake, exhaust, circulation, or other.
      default: other
    climate_node_id:
      name: Climate node ID
      description: Optional climate tree node this vent belongs to.
    notes:
      name: Notes
    vent_id:
      name: Vent ID
      description: Update an existing vent by stable id.

record_tachometer:
  name: Record tachometer
  description: >
    Append a manual fan tachometer or airflow reading for a labeled vent.
    Provide vent_id or vent_label. recorded_at defaults to now (UTC ISO).
  fields:
    value:
      name: Value
      required: true
      description: Tachometer or airflow reading.
    unit:
      name: Unit
      description: rpm, cfm, or fpm.
      default: rpm
    vent_label:
      name: Vent label
      description: Creates the vent if it does not exist yet.
    vent_id:
      name: Vent ID
    recorded_at:
      name: Timestamp
      description: ISO timestamp. Defaults to now.
    vent_role:
      name: Vent role
      description: Used when creating a new vent from vent_label.
      default: other
    climate_node_id:
      name: Climate node ID
    notes:
      name: Notes
