# Mix-room scale station (HX711 + BME280) on ESP32 D1 Mini32 / esp32dev.
# Intake source (do not commit live secrets): workspace docs/intake/esp devices/scale.yaml
# HA T1 mock entity contract: docs/user/mock-scale.md (esp32dev_* names on the live scale).
substitutions:
  device_name: cf-mixroom-scale01
  friendly_name: Mixroom Scale 01
  area_name: Mix Room
  node_role: scale-station
  firmware_version: "0.1.0-mock"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_ssid: "CF-Scale-Fallback"
  fallback_password: !secret fallback_password
  # Default D1 Mini32-safe picks; replace from verified harness before production flash.
  i2c_sda_pin: GPIO21
  i2c_scl_pin: GPIO22
  bme280_address: "0x76"
  hx711_dout_pin: GPIO34
  hx711_clk_pin: GPIO33

packages:
  base: !include ../packages/common/base.yaml
  wifi: !include ../packages/common/network-wifi.yaml
  diagnostics: !include ../packages/common/diagnostics.yaml
  provisioning: !include ../packages/common/provisioning.yaml
  board: !include ../packages/boards/esp32-d1-mini32.yaml
  role: !include ../packages/roles/scale-station.yaml
